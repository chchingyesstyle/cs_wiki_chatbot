<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Wiki Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px 15px 0 0;
            text-align: center;
        }
        
        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.5;
        }
        
        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .message.bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 5px;
        }
        
        .message-sources {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            padding: 8px;
            background: #f0f0f0;
            border-radius: 8px;
        }
        
        .message-sources a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            margin: 0 4px;
        }
        
        .message-sources a:hover {
            text-decoration: underline;
        }
        
        .feedback-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        
        .feedback-btn {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 15px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .feedback-btn:hover {
            background: #f0f0f0;
        }
        
        .feedback-btn.selected-up {
            background: #d4edda;
            border-color: #28a745;
            color: #28a745;
        }
        
        .feedback-btn.selected-down {
            background: #f8d7da;
            border-color: #dc3545;
            color: #dc3545;
        }
        
        .feedback-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .correction-form {
            margin-top: 10px;
            padding: 10px;
            background: #fff3cd;
            border-radius: 8px;
            display: none;
        }
        
        .correction-form.show {
            display: block;
        }
        
        .correction-form textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
        }
        
        .correction-form button {
            margin-top: 8px;
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .feedback-thanks {
            color: #28a745;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .chat-input-container {
            padding: 20px;
            background: white;
            border-radius: 0 0 15px 15px;
            border-top: 1px solid #e0e0e0;
        }
        
        .chat-input-form {
            display: flex;
            gap: 10px;
        }
        
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #messageInput:focus {
            border-color: #667eea;
        }
        
        #sendButton {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        #sendButton:hover {
            transform: translateY(-2px);
        }
        
        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 15px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }
        
        .status {
            text-align: center;
            padding: 10px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 CS Wiki Chatbot</h1>
            <p>Ask me anything about the CS wiki!</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-content">
                    Hello! I'm your CS Wiki assistant. Ask me anything about the content in CS Wiki.
                </div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <form class="chat-input-form" id="chatForm">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type your question here..."
                    autocomplete="off"
                >
                <button type="submit" id="sendButton">Send</button>
            </form>
            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        // Get API URL from query parameter or use same host with different port
        const urlParams = new URLSearchParams(window.location.search);
        const apiPort = urlParams.get('api_port') || '5000';
        const API_URL = window.location.protocol + '//' + window.location.hostname + ':' + apiPort;
        
        // Generate or retrieve session ID for conversation continuity
        let sessionId = sessionStorage.getItem('chatbot_session_id');
        if (!sessionId) {
            sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            sessionStorage.setItem('chatbot_session_id', sessionId);
        }
        
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const status = document.getElementById('status');

        // Check API health
        fetch(`${API_URL}/health`)
            .then(r => r.json())
            .then(data => {
                if (data.chatbot_ready) {
                    status.textContent = '✓ Connected';
                    status.style.color = 'green';
                } else {
                    status.textContent = '⚠ Bot not ready';
                    status.style.color = 'orange';
                }
            })
            .catch(() => {
                status.textContent = '✗ Cannot connect to server';
                status.style.color = 'red';
            });

        function addMessage(content, isUser, sources = null, question = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(contentDiv);
            
            if (sources && sources.length > 0) {
                const sourcesDiv = document.createElement('div');
                sourcesDiv.className = 'message-sources';
                sourcesDiv.innerHTML = '📚 Sources: ' + sources.map(source => {
                    if (typeof source === 'object' && source.url && source.title) {
                        return `<a href="${source.url}" target="_blank">${source.title}</a>`;
                    } else if (typeof source === 'object' && source.url) {
                        return `<a href="${source.url}" target="_blank">${source.url}</a>`;
                    } else {
                        return source;
                    }
                }).join(', ');
                contentDiv.appendChild(sourcesDiv);
            }
            
            // Add feedback buttons for bot messages
            if (!isUser && question) {
                const feedbackDiv = document.createElement('div');
                feedbackDiv.className = 'feedback-buttons';
                feedbackDiv.innerHTML = `
                    <button class="feedback-btn" data-rating="up" title="Good answer">
                        👍 Helpful
                    </button>
                    <button class="feedback-btn" data-rating="down" title="Bad answer">
                        👎 Not helpful
                    </button>
                `;
                
                // Correction form (hidden by default)
                const correctionDiv = document.createElement('div');
                correctionDiv.className = 'correction-form';
                correctionDiv.innerHTML = `
                    <textarea placeholder="What would be the correct answer? (optional)"></textarea>
                    <button type="button">Submit Correction</button>
                `;
                
                // Thanks message
                const thanksDiv = document.createElement('div');
                thanksDiv.className = 'feedback-thanks';
                thanksDiv.style.display = 'none';
                
                contentDiv.appendChild(feedbackDiv);
                contentDiv.appendChild(correctionDiv);
                contentDiv.appendChild(thanksDiv);
                
                // Handle feedback clicks
                const feedbackBtns = feedbackDiv.querySelectorAll('.feedback-btn');
                feedbackBtns.forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const rating = btn.dataset.rating;
                        
                        if (rating === 'down') {
                            // Show correction form for negative feedback
                            correctionDiv.classList.add('show');
                            btn.classList.add('selected-down');
                            feedbackBtns.forEach(b => b.disabled = true);
                        } else {
                            // Submit positive feedback immediately
                            btn.classList.add('selected-up');
                            feedbackBtns.forEach(b => b.disabled = true);
                            await submitFeedback(question, content, rating, sources, null);
                            thanksDiv.textContent = '✓ Thank you for your feedback!';
                            thanksDiv.style.display = 'block';
                        }
                    });
                });
                
                // Handle correction submission
                const correctionBtn = correctionDiv.querySelector('button');
                correctionBtn.addEventListener('click', async () => {
                    const correction = correctionDiv.querySelector('textarea').value;
                    await submitFeedback(question, content, 'down', sources, correction);
                    correctionDiv.classList.remove('show');
                    thanksDiv.textContent = '✓ Thank you for your feedback and correction!';
                    thanksDiv.style.display = 'block';
                });
            }
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        async function submitFeedback(question, answer, rating, sources, correction) {
            try {
                const response = await fetch(`${API_URL}/api/feedback`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        question,
                        answer,
                        rating,
                        sources,
                        correction
                    })
                });
                
                const data = await response.json();
                console.log('Feedback submitted:', data);
                return data;
            } catch (error) {
                console.error('Error submitting feedback:', error);
            }
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'message bot';
            typingDiv.innerHTML = `
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            const typingDiv = document.getElementById('typingIndicator');
            if (typingDiv) {
                typingDiv.remove();
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const question = messageInput.value.trim();
            if (!question) return;
            
            // Add user message
            addMessage(question, true);
            messageInput.value = '';
            
            // Disable input
            sendButton.disabled = true;
            messageInput.disabled = true;
            
            // Show typing indicator
            showTyping();
            
            try {
                const response = await fetch(`${API_URL}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question, session_id: sessionId })
                });
                
                const data = await response.json();
                
                // Update session_id if server provides one
                if (data.session_id) {
                    sessionId = data.session_id;
                    sessionStorage.setItem('chatbot_session_id', sessionId);
                }
                
                hideTyping();
                
                if (response.ok) {
                    addMessage(data.answer, false, data.sources, question);
                } else {
                    addMessage(`Error: ${data.error}`, false, null, null);
                }
            } catch (error) {
                hideTyping();
                addMessage(`Error: Cannot connect to server. ${error.message}`, false, null, null);
            } finally {
                sendButton.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        });
    </script>
</body>
</html>
